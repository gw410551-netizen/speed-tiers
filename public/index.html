<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>SpeedTiers - Rankings</title>
    <!-- استيراد خط Cairo الفخم -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: #0b0e14; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 25px; }
        
        /* شريط التنقل العلوي */
        .top-nav {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 10px;
            padding: 0 5px;
        }

        /* زر ديسكورد */
        .discord-btn {
            background-color: #5865F2;
            color: #fff;
            text-decoration: none;
            padding: 9px 18px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s, box-shadow 0.2s, transform 0.2s;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.35);
        }

        .discord-btn:hover {
            background-color: #4752c4;
            box-shadow: 0 6px 20px rgba(88, 101, 242, 0.5);
            transform: translateY(-2px);
        }

        .discord-btn svg {
            width: 20px;
            height: 20px;
            fill: #fff;
        }

        header { text-align: center; margin-bottom: 25px; }
        
        /* عنوان الموقع بالأصفر الساطع والفخم */
        h1 { 
            color: #ffd700; 
            font-size: 2.8rem; 
            text-shadow: 0 0 20px rgba(255,215,0,0.35); 
            margin-bottom: 5px; 
            font-weight: 900; 
            letter-spacing: -1px; 
        }
        p { color: #8a99ad; font-size: 1.05rem; font-weight: 600; }

        /* منطقة التحكم والبحث */
        .controls-container {
            width: 90%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        .gamemodes-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .gm-btn {
            background-color: #131822;
            color: #8a99ad;
            border: 1px solid #1f293d;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        .gm-btn img {
    width: 18px !important;
    height: 18px !important;
    object-fit: contain;
}

        .gm-btn:hover {
            border-color: #ffd700;
            color: #fff;
        }

        /* الزر النشط للأنماط أصبح أصفر */
        .gm-btn.active {
            background-color: #ffd700;
            color: #0b0e14;
            border-color: #ffd700;
            box-shadow: 0 0 12px rgba(255,215,0,0.4);
        }

        /* صندوق البحث */
        .search-box {
            position: relative;
            flex: 1;
            min-width: 220px;
            max-width: 280px;
        }

        .search-box input {
            width: 100%;
            background-color: #131822;
            border: 1px solid #1f293d;
            border-radius: 8px;
            padding: 10px 15px 10px 40px;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: #ffd700;
            box-shadow: 0 0 8px rgba(255,215,0,0.25);
        }

        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.85rem;
            opacity: 0.7;
        }

        /* الجدول الاحترافي */
        .table-container { 
            width: 90%; 
            max-width: 1000px; 
            background: #131822; 
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); 
            border: 1px solid #1f293d; 
        }
        
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th, td { padding: 16px 20px; }
        
        /* رؤوس الجدول بلون أصفر هادئ وجميل */
        th { 
            background-color: #1a2233; 
            color: #ffd700; 
            font-weight: 700; 
            font-size: 0.95rem; 
            border-bottom: 2px solid #2a364d; 
        }
        
        tr { border-bottom: 1px solid #1f293d; transition: background 0.2s; }
        tr:hover { background-color: #172030; }
        
        .player-cell { display: flex; align-items: center; gap: 15px; }
        .player-skin { width: 38px; height: 38px; image-rendering: pixelated; background: #1f293d; border-radius: 6px; padding: 2px; border: 1px solid #2a364d; }
        
        /* شارات الرتب أصبحت بإطار وتصميم أصفر متناسق */
        .badge { 
            background: #1a2233; 
            color: #ffd700; 
            padding: 6px 14px; 
            border-radius: 6px; 
            font-weight: 800; 
            display: inline-block; 
            border: 1px solid rgba(255,215,0,0.3); 
            letter-spacing: 0.5px; 
        }
        
        .mode-badge { background: #2a364d; color: #fff; padding: 6px 14px; border-radius: 6px; font-size: 0.9rem; font-weight: 600; }
        .date { color: #8a99ad; font-size: 0.9rem; font-weight: 600; }
    </style>
</head>
<body>

    <!-- زر ديسكورد العلوي -->
    <div class="top-nav">
        <a href="https://discord.gg/kwERMjej43" target="_blank" class="discord-btn">
            <svg viewBox="0 0 127.14 96.36">
                <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.68,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.14c2.62-27.29-4.52-51.2-19.49-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53s5.18-12.72,11.45-12.72S53.9,46,53.88,53,48.71,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5.18-12.72,11.45-12.72S96.15,46,96.13,53,91,65.69,84.69,65.69Z"/>
            </svg>
            انضم لسيرفر الديسكورد
        </a>
    </div>

    <header>
        <h1>⚡ SpeedTiers Rankings</h1>
        <p>لوحة المتصدرين الرسمية لاختبارات الـ PvP</p>
    </header>

    <!-- شريط الأنماط والبحث -->
    <div class="controls-container">
        <div class="gamemodes-bar">
            <button class="gm-btn active" onclick="filterGameMode('Sword', this)"><img src="sword.svg" class="btn-icon"> Sword</button>
            <button class="gm-btn" onclick="filterGameMode('Mace', this)"><img src="mace.svg" class="btn-icon"> Mace</button>
            <button class="gm-btn" onclick="filterGameMode('Vanilla', this)"><img src="vanilla.svg" class="btn-icon"> Vanilla</button>
            <button class="gm-btn" onclick="filterGameMode('UHC', this)"><img src="uhc.svg" class="btn-icon"> UHC</button>
            <button class="gm-btn" onclick="filterGameMode('Pot', this)"><img src="pot.svg" class="btn-icon"> Pot</button>
            <button class="gm-btn" onclick="filterGameMode('NethOP', this)"><img src="nethop.svg" class="btn-icon"> NethOP</button>
            <button class="gm-btn" onclick="filterGameMode('SMP', this)"><img src="smp.svg" class="btn-icon"> SMP</button>
            <button class="gm-btn" onclick="filterGameMode('Axe', this)"><img src="axe.svg" class="btn-icon"> Axe</button>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن اسم اللاعب..." oninput="handleSearch()">
        </div>
    </div>

    <div class="table-container">
        <table id="resultsTable">
            <thead>
                <tr>
                    <th>#</th>
                    <th>اللاعب</th>
                    <th>الرتبة</th>
                    <th>النمط</th>
                    <th>التاريخ</th>
                </tr>
            </thead>
            <tbody>
                <!-- النتائج -->
            </tbody>
        </table>
    </div>

    <script>
        let allResults = [];
        let currentMode = 'Sword';

        const tierRanks = {
            'HT1': 1, 'LT1': 2, 'HT2': 3, 'LT2': 4, 
            'HT3': 5, 'LT3': 6, 'HT4': 7, 'LT4': 8, 
            'HT5': 9, 'LT5': 10
        };

    // قم بتغيير السطر القديم إلى هذا السطر الجديد
fetch('/api/results')
    .then(res => res.json())
    .then(data => {
        allResults = data;
        sortAndRender(currentMode);
    })
    .catch(err => {
        console.error("خطأ في جلب البيانات:", err);
        // يمكنك إضافة تنبيه بسيط هنا إذا أردت
    });

        function renderTable(data) {
            const tbody = document.querySelector('#resultsTable tbody');
            tbody.innerHTML = '';
            
            if(data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #8a99ad; padding: 30px; font-weight: 600;">لا توجد نتائج مطابقة للبحث أو لهذا النمط.</td></tr>`;
                return;
            }

            data.sort((a, b) => {
                const rankA = tierRanks[a.tierLevel.toUpperCase()] || 99;
                const rankB = tierRanks[b.tierLevel.toUpperCase()] || 99;
                return rankA - rankB;
            });

            data.forEach((item, index) => {
                const skinHeadUrl = item.skinUrl ? item.skinUrl : `https://mc-heads.net/avatar/${item.minecraftName}/38`;
                
                // المركز الأول أصفر ذهبي ساطع (#ffd700)، وباقي المراكز أصفر داكن/برونزي (#d4af37)
                const rankColor = index === 0 ? '#ffd700' : '#d4af37';

                tbody.innerHTML += `
                    <tr>
                        <td style="font-weight: 800; color: ${rankColor};">${index + 1}</td>
                        <td>
                            <div class="player-cell">
                                <img src="${skinHeadUrl}" class="player-skin" alt="skin">
                                <span style="font-weight: 700; font-size: 1.05rem;">${item.minecraftName}</span>
                            </div>
                        </td>
                        <td><span class="badge">${item.tierLevel}</span></td>
                        <td><span class="mode-badge">${item.gameMode}</span></td>
                        <td class="date">${new Date(item.date).toLocaleDateString('ar-EG')}</td>
                    </tr>
                `;
            });
        }

        function filterGameMode(mode, btnElement) {
            document.querySelectorAll('.gm-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            currentMode = mode;
            document.getElementById('searchInput').value = '';
            sortAndRender(mode);
        }

        function sortAndRender(mode) {
            const filtered = allResults.filter(item => 
                item.gameMode && item.gameMode.trim().toLowerCase() === mode.trim().toLowerCase()
            );
            renderTable(filtered);
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const filtered = allResults.filter(item => {
                const matchesMode = item.gameMode && item.gameMode.trim().toLowerCase() === currentMode.trim().toLowerCase();
                const matchesName = item.minecraftName && item.minecraftName.toLowerCase().includes(query);
                return matchesMode && matchesName;
            });
            renderTable(filtered);
        }
    </script>
</body>
</html>
