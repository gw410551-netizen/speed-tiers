<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>SpeedTiers - Rankings</title>
    <!-- استيراد خط Cairo الفخم -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: #0b0e14; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 30px 20px; }
        
        /* الهيدر العلوي */
        .main-header {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 20px;
            border-bottom: 1px solid #1f293d;
            padding-bottom: 20px;
        }

        .brand-section {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        /* تنسيق صورة الشعار بدلاً من النص */
        .brand-logo { 
            height: 45px; /* يمكنك تعديل الارتفاع حسب حجم صورتك المناسب */
            object-fit: contain;
        }

        .brand-subtitle {
            color: #8a99ad;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .discord-btn {
            background-color: #131822;
            color: #fff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #1f293d;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .discord-btn:hover {
            background-color: #5865F2;
            border-color: #5865F2;
            box-shadow: 0 6px 20px rgba(88, 101, 242, 0.4);
            transform: translateY(-2px);
        }

        .discord-btn svg {
            width: 20px;
            height: 20px;
            fill: #fff;
        }

        /* حاوية الأنماط والبحث */
        .controls-container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 25px;
        }

        /* شريط الجيم مودز المنحني الفخم */
        .gamemodes-bar {
            display: flex;
            background-color: #111622;
            padding: 8px;
            border-radius: 16px;
            gap: 6px;
            overflow-x: auto;
            border: 1px solid #1f293d;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            scrollbar-width: thin;
            scrollbar-color: #2a364d #111622;
        }

        .gamemodes-bar::-webkit-scrollbar { height: 6px; }
        .gamemodes-bar::-webkit-scrollbar-thumb { background-color: #2a364d; border-radius: 10px; }

        .gm-btn {
            background-color: transparent;
            color: #8a99ad;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.92rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
            flex: 1;
            min-width: 90px;
            white-space: nowrap;
        }

        .gm-btn img {
            width: 22px;
            height: 22px;
            object-fit: contain;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .gm-btn:hover { color: #fff; background-color: rgba(255, 255, 255, 0.03); }
        .gm-btn:hover img { opacity: 1; }

        .gm-btn.active {
            background-color: #1a2233;
            color: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,215,0,0.15);
        }
        .gm-btn.active img { opacity: 1; }
        .gm-btn.overall-btn.active { color: #ffd700; border-color: rgba(255,215,0,0.4); }

        .search-filter-row { display: flex; justify-content: flex-end; width: 100%; }
        .search-box { position: relative; width: 100%; max-width: 320px; }
        
        .search-box input {
            width: 100%;
            background-color: #131822;
            border: 1px solid #1f293d;
            border-radius: 12px;
            padding: 11px 15px 11px 45px;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .search-box input:focus { border-color: #ffd700; box-shadow: 0 0 12px rgba(255,215,0,0.25); }
        .search-box::before { content: "🔍"; position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 0.9rem; opacity: 0.7; }

        /* الجدول الاحترافي */
        .table-container { 
            width: 100%; 
            max-width: 1100px; 
            background: #131822; 
            border-radius: 14px; 
            overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); 
            border: 1px solid #1f293d; 
        }
        
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th, td { padding: 16px 20px; }
        
        th { 
            background-color: #1a2233; 
            color: #ffd700; 
            font-weight: 700; 
            font-size: 0.9rem; 
            border-bottom: 2px solid #2a364d; 
        }
        
        tr { border-bottom: 1px solid #1f293d; transition: background 0.2s; }
        tr:hover { background-color: #172030; }
        
        .player-cell { display: flex; align-items: center; gap: 15px; }
        .player-skin { width: 38px; height: 38px; image-rendering: pixelated; background: #1f293d; border-radius: 8px; padding: 2px; border: 1px solid #2a364d; }
        
        .badge { 
            background: #1a2233; 
            color: #ffd700; 
            padding: 6px 14px; 
            border-radius: 8px; 
            font-weight: 800; 
            display: inline-block; 
            border: 1px solid rgba(255,215,0,0.3); 
            font-size: 0.85rem;
        }
        
        .mode-badge { background: #2a364d; color: #fff; padding: 6px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; }
        .date { color: #8a99ad; font-size: 0.85rem; font-weight: 600; }

        /* تنسيق أيقونات ورتب الجيم مودز بجانب اللاعب في الأوفرول */
        .player-tiers-container {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .tier-item-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #172030;
            padding: 5px 8px;
            border-radius: 8px;
            border: 1px solid #232f45;
            min-width: 45px;
        }

        .tier-item-box img {
            width: 18px;
            height: 18px;
            object-fit: contain;
            margin-bottom: 3px;
        }

        .tier-item-box span {
            font-size: 0.75rem;
            font-weight: 800;
            color: #ffd700;
        }
    </style>
</head>
<body>

    <!-- الهيدر العلوي -->
    <header class="main-header">
        <div class="brand-section">
            <!-- تم استبدال النص بصورة الشعار -->
            <img src="speedtires.png" alt="SpeedTiers Logo" class="brand-logo">
            <span class="brand-subtitle">لوحة المتصدرين الرسمية لاختبارات الـ PvP</span>
        </div>
        <a href="https://discord.gg/kwERMjej43" target="_blank" class="discord-btn">
            <svg viewBox="0 0 127.14 96.36">
                <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.68,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.14c2.62-27.29-4.52-51.2-19.49-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53s5.18-12.72,11.45-12.72S53.9,46,53.88,53,48.71,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5.18-12.72,11.45-12.72S96.15,46,96.13,53,91,65.69,84.69,65.69Z"/>
            </svg>
            انضم لسيرفر الديسكورد
        </a>
    </header>

    <!-- منطقة التحكم والبحث -->
    <div class="controls-container">
        <div class="gamemodes-bar">
            <button class="gm-btn overall-btn active" onclick="filterGameMode('Overall', this)"><img src="overall.svg"> Overall</button>
            <button class="gm-btn" onclick="filterGameMode('Sword', this)"><img src="sword.svg"> Sword</button>
            <button class="gm-btn" onclick="filterGameMode('Mace', this)"><img src="mace.svg"> Mace</button>
            <button class="gm-btn" onclick="filterGameMode('Vanilla', this)"><img src="vanilla.svg"> Vanilla</button>
            <button class="gm-btn" onclick="filterGameMode('UHC', this)"><img src="uhc.svg"> UHC</button>
            <button class="gm-btn" onclick="filterGameMode('Pot', this)"><img src="pot.svg"> Pot</button>
            <button class="gm-btn" onclick="filterGameMode('NethOP', this)"><img src="nethop.svg"> NethOP</button>
            <button class="gm-btn" onclick="filterGameMode('SMP', this)"><img src="smp.svg"> SMP</button>
            <button class="gm-btn" onclick="filterGameMode('Axe', this)"><img src="axe.svg"> Axe</button>
        </div>

        <div class="search-filter-row">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="ابحث عن اسم اللاعب..." oninput="handleSearch()">
            </div>
        </div>
    </div>

    <!-- جدول النتائج -->
    <div class="table-container">
        <table id="resultsTable">
            <thead>
                <tr id="tableHeaders"></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        let allResults = [];
        let currentMode = 'Overall';

        const gameModesList = ['Sword', 'Mace', 'Vanilla', 'UHC', 'Pot', 'NethOP', 'SMP', 'Axe'];
        const modeIcons = {
            'sword': 'sword.svg',
            'mace': 'mace.svg',
            'vanilla': 'vanilla.svg',
            'uhc': 'uhc.svg',
            'pot': 'pot.svg',
            'nethop': 'nethop.svg',
            'smp': 'smp.svg',
            'axe': 'axe.svg'
        };

        const tierPoints = {
            'HT1': 60, 'LT1': 45, 
            'HT2': 30, 'LT2': 20, 
            'HT3': 10, 'LT3': 6, 
            'HT4': 4,  'LT4': 3, 
            'HT5': 2,  'LT5': 1
        };

        const tierRanks = {
            'HT1': 1, 'LT1': 2, 'HT2': 3, 'LT2': 4, 
            'HT3': 5, 'LT3': 6, 'HT4': 7, 'LT4': 8, 
            'HT5': 9, 'LT5': 10
        };

        fetch('https://raw.githubusercontent.com/gw410551-netizen/speed-tiers/main/results.json?v=' + Date.now(), { cache: 'no-store' })
            .then(res => res.json())
            .then(data => {
                allResults = data;
                sortAndRender(currentMode);
            })
            .catch(err => console.error('خطأ في جلب البيانات:', err));

        function renderTable(data, mode) {
            const theadTr = document.getElementById('tableHeaders');
            const tbody = document.querySelector('#resultsTable tbody');
            tbody.innerHTML = '';

            if (mode === 'Overall') {
                theadTr.innerHTML = `
                    <th>#</th>
                    <th>اللاعب</th>
                    <th>إجمالي النقاط والرتب</th>
                `;

                if(data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: #8a99ad; padding: 30px; font-weight: 600;">لا توجد بيانات متاحة لحساب النقاط.</td></tr>`;
                    return;
                }

                data.forEach((player, index) => {
                    const skinHeadUrl = player.skinUrl ? player.skinUrl : `https://mc-heads.net/avatar/Steve/36`;
                    const rankColor = index === 0 ? '#ffd700' : '#d4af37';

                    let tiersHtml = `<div class="player-tiers-container">`;
                    gameModesList.forEach(mName => {
                        const mKey = mName.toLowerCase();
                        if (player.modes[mKey]) {
                            const tVal = player.modes[mKey];
                            const iconFile = modeIcons[mKey] || 'sword.svg';
                            tiersHtml += `
                                <div class="tier-item-box" title="${mName}: ${tVal}">
                                    <img src="${iconFile}" alt="${mName}">
                                    <span>${tVal}</span>
                                </div>
                            `;
                        }
                    });
                    tiersHtml += `</div>`;

                    tbody.innerHTML += `
                        <tr>
                            <td style="font-weight: 800; color: ${rankColor};">${index + 1}</td>
                            <td>
                                <div class="player-cell">
                                    <img src="${skinHeadUrl}" class="player-skin" alt="skin">
                                    <span style="font-weight: 700; font-size: 1rem;">${player.name}</span>
                                </div>
                            </td>
                            <td>
                                <div style="display: flex; align-items: center; gap: 20px; flex-wrap: wrap;">
                                    <span class="badge" style="background: #1f293d; color: #ffd700;">⚡ ${player.totalPoints} نقطة</span>
                                    ${tiersHtml}
                                </div>
                            </td>
                        </tr>
                    `;
                });

            } else {
                theadTr.innerHTML = `
                    <th>#</th>
                    <th>اللاعب</th>
                    <th>الرتبة</th>
                    <th>النمط</th>
                    <th>التاريخ</th>
                `;

                if(data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #8a99ad; padding: 30px; font-weight: 600;">لا توجد نتائج مطابقة للبحث أو لهذا النمط.</td></tr>`;
                    return;
                }

                data.sort((a, b) => {
                    const rankA = tierRanks[(a.tierLevel || '').toUpperCase()] || 99;
                    const rankB = tierRanks[(b.tierLevel || '').toUpperCase()] || 99;
                    return rankA - rankB;
                });

                data.forEach((item, index) => {
                    const skinHeadUrl = item.skinUrl ? item.skinUrl : `https://mc-heads.net/avatar/Steve/36`;
                    const rankColor = index === 0 ? '#ffd700' : '#d4af37';

                    tbody.innerHTML += `
                        <tr>
                            <td style="font-weight: 800; color: ${rankColor};">${index + 1}</td>
                            <td>
                                <div class="player-cell">
                                    <img src="${skinHeadUrl}" class="player-skin" alt="skin">
                                    <span style="font-weight: 700; font-size: 1rem;">${item.minecraftName}</span>
                                </div>
                            </td>
                            <td><span class="badge">${item.tierLevel}</span></td>
                            <td><span class="mode-badge">${item.gameMode}</span></td>
                            <td class="date">${item.date || ''}</td>
                        </tr>
                    `;
                });
            }
        }

        function filterGameMode(mode, btnElement) {
            document.querySelectorAll('.gm-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            currentMode = mode;
            document.getElementById('searchInput').value = '';
            sortAndRender(mode);
        }

        function sortAndRender(mode) {
            if (mode === 'Overall') {
                const playerMap = {};
                
                allResults.forEach(item => {
                    if (!item.minecraftName || !item.gameMode || !item.tierLevel) return;
                    const name = item.minecraftName.trim();
                    const modeClean = item.gameMode.trim().toLowerCase();
                    const tier = item.tierLevel.toUpperCase();

                    if (!playerMap[name]) {
                        playerMap[name] = {
                            name: name,
                            totalPoints: 0,
                            skinUrl: item.skinUrl || '',
                            modes: {}
                        };
                    }
                    
                    playerMap[name].modes[modeClean] = tier;
                    if(item.skinUrl && !playerMap[name].skinUrl) {
                        playerMap[name].skinUrl = item.skinUrl;
                    }
                });

                const playersArray = Object.values(playerMap);
                playersArray.forEach(p => {
                    let sum = 0;
                    Object.values(p.modes).forEach(t => {
                        sum += (tierPoints[t] || 0);
                    });
                    p.totalPoints = sum;
                });

                playersArray.sort((a, b) => b.totalPoints - a.totalPoints);
                renderTable(playersArray, 'Overall');
            } else {
                const filtered = allResults.filter(item => 
                    item.gameMode && item.gameMode.trim().toLowerCase() === mode.trim().toLowerCase()
                );
                renderTable(filtered, mode);
            }
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            
            if (currentMode === 'Overall') {
                const playerMap = {};
                allResults.forEach(item => {
                    if (!item.minecraftName || !item.gameMode || !item.tierLevel) return;
                    const name = item.minecraftName.trim();
                    if (!name.toLowerCase().includes(query)) return;

                    const modeClean = item.gameMode.trim().toLowerCase();
                    const tier = item.tierLevel.toUpperCase();

                    if (!playerMap[name]) {
                        playerMap[name] = { name: name, totalPoints: 0, skinUrl: item.skinUrl || '', modes: {} };
                    }
                    playerMap[name].modes[modeClean] = tier;
                    if(item.skinUrl && !playerMap[name].skinUrl) { playerMap[name].skinUrl = item.skinUrl; }
                });

                const playersArray = Object.values(playerMap);
                playersArray.exports?.forEach?.();
                playersArray.forEach(p => {
                    let sum = 0;
                    Object.values(p.modes).forEach(t => { sum += (tierPoints[t] || 0); });
                    p.totalPoints = sum;
                });

                playersArray.sort((a, b) => b.totalPoints - a.totalPoints);
                renderTable(playersArray, 'Overall');
            } else {
                const filtered = allResults.filter(item => {
                    const matchesMode = item.gameMode && item.gameMode.trim().toLowerCase() === currentMode.trim().toLowerCase();
                    const matchesName = item.minecraftName && item.minecraftName.toLowerCase().includes(query);
                    return matchesMode && matchesName;
                });
                renderTable(filtered, currentMode);
            }
        }
    </script>
</body>
</html>
